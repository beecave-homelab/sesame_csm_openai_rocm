services:
  csm-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - HF_TOKEN=${HF_TOKEN}
        - TTS_ENGINE=${TTS_ENGINE:-csm}
    ports:
      - "8999:8000"
    volumes:
      - ./models:/app/models
      - ./cloned_voices:/app/cloned_voices
      - ./voice_references:/app/voice_references  
      - ./voice_profiles:/app/voice_profiles    
    environment:
      - HF_TOKEN=${HF_TOKEN}  
      - TTS_ENGINE=${TTS_ENGINE:-csm}  # Default to CSM if not specified
    # ROCm/AMD GPU access and runtime options
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
    stdin_open: true
    tty: true
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp=unconfined
    group_add:
      - video
    ipc: host
    shm_size: 8G